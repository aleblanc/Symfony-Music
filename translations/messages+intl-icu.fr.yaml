        spectrum_note: "Où s’arrêtent les aigus de chaque titre (php bin/console app:cron:spectrum). Un encodeur coupe net selon le débit : chaque tranche est la coupure d’un débit MP3 (LAME : 15,6 kHz pour un 112, 17 pour un 128, 18,6 pour un 192, 20,5 pour un 320) et la couleur indique le niveau de ce débit. Un vieil enregistrement ou une source à bande étroite (diffusion en 32 kHz) descend bas aussi sans être un réencodage. Un fichier n’est compté gonflé que si sa coupure est plus basse que tout encodage authentique à son débit annoncé : sous 19 kHz pour un 256–320, donc un vrai 224 ou 256 réencodé en 320 n’est pas détectable, et un fichier signalé est jugé au débit de sa coupure, jamais entre les deux."
